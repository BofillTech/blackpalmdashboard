<style>
:root{
  --bg0:#0E1210; --bg1:#141A17; --bg2:#1B2320; --bg3:#222C27;
  --line:#263029; --line2:#33403A;
  --t1:#E8ECE7; --t2:#9AA79D; --t3:#5F6B62;
  --brass:#C9A96A; --brass-dim:#8A7448;
  --red:#E0524A; --amber:#E39A3B; --ok:#4FA37C; --info:#6B93B8;
  --red-bg:rgba(224,82,74,.12); --amber-bg:rgba(227,154,59,.12); --ok-bg:rgba(79,163,124,.12);
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg0);color:var(--t1);font-family:'Archivo',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,textarea{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:216px 1fr;height:100vh}
/* ---------- rail ---------- */
.rail{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid var(--line)}
.brand svg{flex:none}
.brand .bp-name{font-weight:600;font-size:13px;letter-spacing:.14em;line-height:1.25}
.brand .bp-sub{font-size:10.5px;color:var(--t3);letter-spacing:.06em}
.nav{padding:14px 10px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:6px;color:var(--t2);font-size:13.5px;text-align:left;transition:background .12s,color .12s}
.nav button:hover{background:var(--bg2);color:var(--t1)}
.nav button.on{background:var(--bg3);color:var(--t1)}
.nav button.on .ic{color:var(--brass)}
.nav .ic{width:17px;height:17px;flex:none;color:var(--t3)}
.nav .badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--red-bg);color:var(--red);font-weight:600}
.nav .soon{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:var(--bg3);color:var(--t3)}
.railfoot{padding:12px 14px 0;border-top:1px solid var(--line)}
.demo-btn{width:100%;padding:9px 12px;border-radius:6px;border:1px dashed var(--brass-dim);color:var(--brass);font-size:12.5px;transition:background .12s}
.demo-btn:hover{background:rgba(201,169,106,.08)}
.demo-btn:disabled{opacity:.4;cursor:default}
.railfoot .who{display:flex;align-items:center;gap:9px;margin-top:12px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--brass)}
.who div p{font-size:12.5px;line-height:1.3}
.who div span{font-size:11px;color:var(--t3)}
/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--bg1)}
.topbar h1{font-size:15px;font-weight:600}
.topbar .org{font-size:12.5px;color:var(--t3)}
.posture{display:flex;align-items:center;gap:8px;margin-left:auto}
.posture .lbl{font-size:12px;color:var(--t2)}
.chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;transition:all .3s}
.chip.guarded{background:rgba(201,169,106,.14);color:var(--brass)}
.chip.elevated{background:var(--amber-bg);color:var(--amber)}
.chip.critical{background:var(--red-bg);color:var(--red)}
.clock{font-size:12.5px;color:var(--t2)}
.askbtn{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:6px;background:var(--bg3);font-size:13px;color:var(--t1);transition:background .12s}
.askbtn:hover{background:var(--line2)}
.askbtn svg{color:var(--brass)}
.content{flex:1;overflow-y:auto;padding:20px;min-height:0}
/* ---------- cards ---------- */
.card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius)}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--t2)}
.card-h svg{width:15px;height:15px;color:var(--t3)}
.card-h .act{margin-left:auto;font-size:12px;color:var(--brass);cursor:pointer}
.card-b{padding:14px 16px}
.grid{display:grid;gap:14px}
/* metric tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.tile{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile .k{font-size:12px;color:var(--t2);margin-bottom:6px}
.tile .v{font-size:24px;font-weight:600;line-height:1.1}
.tile .d{font-size:11.5px;color:var(--t3);margin-top:4px}
.tile .v.warn{color:var(--amber)}.tile .v.bad{color:var(--red)}.tile .v.good{color:var(--ok)}
/* map */
.map{position:relative;height:100%;min-height:230px;background:
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.025) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.025) 39px 40px),
  var(--bg0);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.fac{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--bg0)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}
.fac .fl{font-size:11px;color:var(--t2);background:rgba(14,18,16,.85);padding:2px 7px;border-radius:4px;white-space:nowrap}
.pulse{position:absolute;top:50%;left:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%)}
.pulse.bad{animation:pulse 1.6s ease-out infinite;background:var(--red)}
@keyframes pulse{0%{opacity:.7;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}
@media (prefers-reduced-motion:reduce){.pulse.bad{animation:none;opacity:.4}.typing::after{animation:none}}
.maplegend{position:absolute;bottom:8px;left:10px;font-size:11px;color:var(--t3)}
.layers{position:absolute;top:8px;right:10px;display:flex;gap:6px}
.layers label{font-size:11px;color:var(--t2);background:rgba(20,26,23,.9);border:1px solid var(--line);padding:3px 8px;border-radius:4px;display:flex;gap:5px;align-items:center;cursor:pointer}
/* feed rows */
.evt{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.evt:last-child{border-bottom:none}
.evt.sev-hi{border-left-color:var(--red);background:linear-gradient(90deg,rgba(224,82,74,.06),transparent 60%)}
.evt.sev-md{border-left-color:var(--amber)}
.evt.sev-lo{border-left-color:var(--t3)}
.evt .et{font-size:13px;font-weight:500}
.evt .em{font-size:11.5px;color:var(--t3);margin-top:2px}
.evt .em a{color:var(--brass);text-decoration:none;cursor:pointer}
.evt.new{animation:drop .4s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* brief */
.brief li{list-style:none;display:flex;gap:9px;padding:5px 0;font-size:13px;color:var(--t1)}
.brief li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brass);margin-top:8px;flex:none}
/* cams */
.camgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cam{position:relative;aspect-ratio:16/10;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),#0A0D0B;
  border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cam .cl{position:absolute;top:6px;left:8px;font-size:10.5px;color:var(--t2)}
.cam .ct{position:absolute;bottom:6px;right:8px;font-size:10px;color:var(--t3)}
.cam .rec{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--red);opacity:.8}
.cam .det{position:absolute;bottom:6px;left:8px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px}
.cam .det.bad{background:var(--red);color:#fff}
.cam .det.warn{background:var(--amber);color:#1a1206}
.cam.alerting{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.cam .box{position:absolute;border:1.5px solid var(--red);width:26%;height:44%;left:38%;top:30%;border-radius:2px}
.cam .box::after{content:"person · firearm";position:absolute;top:-16px;left:-1px;font-size:9px;background:var(--red);color:#fff;padding:1px 4px;border-radius:2px;white-space:nowrap}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--t3);text-align:left;padding:8px 16px;border-bottom:1px solid var(--line)}
td{padding:9px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--bg2)}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.pill.bad{background:var(--red-bg);color:var(--red)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.mut{background:var(--bg3);color:var(--t2)}
/* progress */
.bar{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .5s}
/* buttons */
.btn{padding:8px 14px;border-radius:6px;font-size:13px;background:var(--bg3);color:var(--t1);transition:background .12s}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--brass);color:#181307;font-weight:600}
.btn.primary:hover{background:#D8B97C}
.btn.danger{background:var(--red);color:#fff;font-weight:600}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;background:var(--bg1);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;z-index:40;box-shadow:-16px 0 40px rgba(0,0,0,.35)}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-h svg{color:var(--brass)}
.drawer-h h2{font-size:14px;font-weight:600;flex:1}
.drawer-h .st{font-size:11px;color:var(--t3)}
.chat{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:13px;line-height:1.55;white-space:pre-wrap}
.msg.ai{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.msg.me{align-self:flex-end;background:var(--bg3);border-radius:10px;padding:9px 13px;color:var(--t1)}
.msg.sys{font-size:11.5px;color:var(--t3);align-self:center;text-align:center}
.msg .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.msg .acts button{font-size:12px;padding:5px 11px;border-radius:14px;border:1px solid var(--brass-dim);color:var(--brass);transition:background .12s}
.msg .acts button:hover{background:rgba(201,169,106,.1)}
.msg .acts button:disabled{opacity:.4;border-color:var(--line2);color:var(--t3)}
.msg b{color:var(--brass);font-weight:600}
.typing::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--brass)}
@keyframes blink{50%{opacity:0}}
.chatin{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:9px}
.chatin input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--t1);font-size:13px}
.chatin input::placeholder{color:var(--t3)}
/* toast */
.toast{position:fixed;top:66px;right:20px;background:var(--bg2);border:1px solid var(--red);border-left:4px solid var(--red);border-radius:8px;padding:12px 16px;z-index:60;max-width:340px;animation:drop .3s ease-out;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast .tt{font-size:13px;font-weight:600;color:var(--red)}
.toast .tm{font-size:12px;color:var(--t2);margin-top:3px}
/* composer modal */
.veil{position:fixed;inset:0;background:rgba(8,10,9,.7);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{width:520px;max-width:92vw;background:var(--bg1);border:1px solid var(--line2);border-radius:10px}
.modal .card-b label{display:block;font-size:12px;color:var(--t2);margin:10px 0 4px}
.modal input,.modal textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--t1);font-size:13px}
.modal textarea{min-height:96px;resize:vertical}
.modal .foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 16px;border-top:1px solid var(--line)}
.amtag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--t3)}
.amtag i{width:7px;height:7px;border-radius:2px;background:var(--info);display:inline-block}
/* misc screens */
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.timeline{list-style:none}
.timeline li{position:relative;padding:0 0 16px 22px;font-size:12.5px}
.timeline li::before{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.timeline li::after{content:"";position:absolute;left:8px;top:14px;bottom:-2px;width:1px;background:var(--line2)}
.timeline li:last-child::after{display:none}
.timeline .tt{color:var(--t3);font-size:11px}
.empty{padding:36px 20px;text-align:center;color:var(--t3);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sparkbars{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:10px}
.sparkbars i{flex:1;background:var(--bg3);border-radius:2px 2px 0 0}
.sparkbars i.hi{background:var(--brass-dim)}
.cybergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.notice{background:rgba(201,169,106,.06);border:1px dashed var(--brass-dim);border-radius:8px;padding:12px 16px;font-size:12.5px;color:var(--t2);margin-bottom:14px}
.notice b{color:var(--brass);font-weight:600}

/* decision strip */
.decision{display:grid;grid-template-columns:1fr 1.3fr;background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.decision .pside{padding:18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.plabel{font-size:11.5px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.posture-big{font-size:25px;font-weight:700;letter-spacing:.03em}
.posture-big.guarded{color:var(--brass)}.posture-big.elevated{color:var(--amber)}.posture-big.critical{color:var(--red)}
.decision .why{font-size:13px;color:var(--t2);line-height:1.55}
.decision .aside{padding:12px 20px 14px}
.att{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att:last-child{border-bottom:none}
.att .at{font-size:13px;flex:1;min-width:170px}
.att .sevdot{width:7px;height:7px;border-radius:50%;flex:none}
.att .btns{display:flex;gap:6px;flex-wrap:wrap}
.att .btns button{font-size:11.5px;padding:4px 10px;border-radius:12px;border:1px solid var(--line2);color:var(--t2);transition:all .12s}
.att .btns button:hover{border-color:var(--brass-dim);color:var(--brass)}
.briefcard{border-left:3px solid var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;justify-content:center}
.chips button{font-size:11.5px;padding:5px 11px;border-radius:14px;border:1px solid var(--line2);color:var(--t2);transition:all .12s}
.chips button:hover{border-color:var(--brass-dim);color:var(--brass)}
.askbtn{border:1px solid var(--brass-dim)}
.hb{display:none;width:36px;height:36px;border-radius:6px;background:var(--bg3);align-items:center;justify-content:center;flex:none}
.railveil{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:266px;z-index:46;transform:translateX(-105%);transition:transform .25s}
  .rail.open{transform:none}
  .railveil.on{display:block;position:fixed;inset:0;background:rgba(8,10,9,.6);z-index:45}
  .hb{display:flex}
  .clock{display:none}
  .topbar{gap:10px;padding:0 12px;height:auto;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
  .topbar h1{font-size:14px}
  .posture .lbl{display:none}
  .content{padding:12px}
  .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .decision{grid-template-columns:1fr}
  .decision .pside{border-right:none;border-bottom:1px solid var(--line)}
  .home-grid{grid-template-columns:1fr !important}
  .camgrid{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .drawer{width:100vw}
  .kpis{grid-template-columns:1fr}
  .cybergrid{grid-template-columns:1fr}
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr)}.camgrid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.home-grid{grid-template-columns:1fr !important}}
</style>
</head>

async function sendChat(){
  const inp=$('chatInput'); const q=inp.value.trim(); if(!q)return;
  inp.value='';
  addMsg('me',esc(q));
  const hold=addMsg('ai','<span class="typing"></span>');
  const sys=`You are "Ask Black Palm", the AI intelligence layer inside the Black Palm Command Center — an enterprise security platform by Black Palm International, deployed for the customer Sterling Financial Group. You are grounded in three sources: (1) customer SOPs, (2) live operational state, (3) Black Palm security doctrine (intelligence-led, prevention-first, proportionate response, human-approved critical actions).

CUSTOMER SOPs:
${SOPS['armed-visitor']}

${SOPS['severe-weather']}

${SOPS['demonstration']}

CUSTOMER KNOWLEDGE LIBRARY (documents on file): ${KDOCS.map(d=>d[0]).join('; ')}. The three SOPs above are excerpted in full; other documents are on file but not excerpted.
When an answer draws on customer doctrine, cite the document by name, e.g. "According to your Miami DC perimeter intrusion playbook, the next required step is…". If asked about a non-excerpted document, describe its purpose and role rather than inventing contents.

LIVE OPERATIONAL STATE (JSON): ${liveStateSummary()}

Rules: Be concise (under 140 words), operational, and calm. Reference SOP numbers when relevant. Recommend concrete next actions. Never claim to predict criminal behavior — frame forward-looking analysis as anticipatory decision support. Plain text only, no markdown headers; short paragraphs or dash lists.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:sys,messages:[{role:'user',content:q}]})
    });
    const data=await r.json();
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(!txt)throw new Error('empty');
    hold.innerHTML=esc(txt);
  }catch(e){
    hold.innerHTML=fallbackAnswer(q);
  }
  $('chat').scrollTop=$('chat').scrollHeight;
}

function fallbackAnswer(q){
  const l=q.toLowerCase();
  if(l.includes('why')&&l.includes('posture')||l.includes('why are we'))return `Posture is <b>${S.posture}</b>. ${S.postureReason} Contributing factors carry different weights: an unresolved perimeter event, an active weather watch, and open corrective actions. Posture recommendations are advisory — changes require Security Director approval.`;
  if(l.includes('attention'))return `Three items need attention: the Miami perimeter event (INC-0142) awaiting closure review, SOP-11 weather readiness checks for both Florida sites, and the overdue Q3 access badge audit. I can open any of these or draft the related notification.`;
  if(l.includes('sop')||l.includes('armed'))return `<b>SOP-7 · Armed visitor / visible weapon response (v3.1)</b>\nKey steps: do not confront — maintain CCTV visual; notify the on-site lead and Command Center (Code 7); initiate a discreet lobby hold; contact law enforcement with a live description; issue shelter guidance to affected floors (template T-12); preserve video and open an incident record. Full document is in your knowledge library.`;
  if(l.includes('playbook')||l.includes('perimeter'))return `According to your Miami DC perimeter intrusion playbook, after a detection the next required steps are: operator verification of the camera event, guard dispatch to the fence segment, physical inspection, and a no-breach or breach determination logged to the incident. INC-0142 completed all four; the remaining corrective action is camera 11 realignment.`;
  if(l.includes('brief'))return `Current posture: <b>${S.posture}</b>. ${S.incidents.length} incident record(s) — ${S.incidents.map(i=>i.id+' '+i.status).join(', ')}. Watch items: tropical storm watch for both Florida sites (SOP-11 checks due within 24h) and Friday's permitted demonstration near NYC HQ (SOP-9 — recommend badge-only access during the window). ${S.tasks.length} open tasks, 1 overdue.`;
  if(l.includes('after-action'))return `<b>After-action draft — INC-0143</b>\nSummary: Scylla detected a visible firearm at NYC HQ lobby cam 4. Command Center correlated the event with SOP-7, an incident was opened, security notified, and a shelter-guidance notification (T-12) issued via AlertMedia with live acknowledgment tracking. Response actions were human-approved and captured to the audit trail.\nRecommended corrective actions: confirm lobby hold drill cadence; validate camera 4 coverage angle; review acknowledgment gaps by floor.`;
  if(l.includes('weather')||l.includes('storm'))return `SOP-11 applies. Both Florida sites sit in the watch area. Recommended within 24h: verify generator fuel and drainage at Miami DC and Palm Beach Regional, pre-stage AlertMedia templates T-4 and T-5, and confirm the remote-work trigger level with HR.`;
  if(l.includes('demonstration')||l.includes('protest'))return `SOP-9 applies to Friday's permitted demonstration near NYC HQ (est. 200–400, route within one block of the main entrance). Recommended: badge-only lobby access 11:00–16:00, brief reception and guard force Thursday, position mobile patrol at the approach, and monitor open-source channels for escalation indicators.`;
  return `I'm operating in offline demo mode (live AI unavailable in this environment). I can still brief you — try "Brief me on everything happening right now", or ask about the storm watch, Friday's demonstration, or the after-action draft.`;
}

function typeInto(el,text,done){

    $('chat').scrollTop=$('chat').scrollHeight;
    if(i>=text.length){clearInterval(iv);el.classList.remove('typing');el.innerHTML=text;done&&done()}
  },14);
}

function sendAlert(){
  closeComposer();
  const cm={title:'Shelter guidance — NYC HQ affected floors',when:'Just now',ch:'SMS + Push + Email',group:'NYC HQ All Staff (274)',ack:0,sent:274,live:true};
  S.comms.unshift(cm);
  const inc=S.incidents.find(i=>i.id==='INC-0143');
  if(inc)inc.timeline.push({t:now(),e:'Employee notification T-12 sent via AlertMedia — 274 recipients, acknowledgment tracking live'});
  addMsg('sys','Notification sent via AlertMedia · tracking acknowledgments live');
  S.audit.unshift({t:now(),u:'D. Marsh',a:'Sent AlertMedia notification T-12 — NYC HQ All Staff (274 recipients)'});
  if(S.screen==='home')renderScreen();
  let tick=0;
  S.ackTimer=setInterval(()=>{
    tick++;
    cm.ack=Math.min(84,Math.round(84*(1-Math.exp(-tick/6))));
    const panel=$('commPanel'); if(panel)panel.innerHTML=commCard(cm);
    const tile=$('ackTile'); if(tile)tile.textContent=cm.ack+'%';
    if(cm.ack>=84){
      clearInterval(S.ackTimer); cm.live=false;
      if(panel)panel.innerHTML=commCard(cm);
      addMsg('ai','Acknowledgment has reached <b>84%</b> (230 of 274). 44 unacknowledged — concentrated on floors 3 and 7. When the incident closes, I can auto-draft the after-action report from the captured timeline.<div class="acts"><button onclick="seedChat(\'Generate an after-action summary for the firearm incident, suitable for the COO.\')">Draft after-action summary</button></div>');
    }
  },900);
}

function now(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ================= BOOT ================= */
function tickClock(){
  const d=new Date();
  $('clock').textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tickClock,15000); tickClock();
renderNav(); renderScreen();
</script>
